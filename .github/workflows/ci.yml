name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Lint
        run: pixi run check

      - name: Test
        run: pixi run test
