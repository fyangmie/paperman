[project]
name = "paperman"
version = "0.1.0"
description = "Enhanced academic paper downloader with multi-source metadata and multi-channel PDF retrieval"
authors = [{name = "laq12345", email = "laq12345@stu.zzu.edu.cn"}]
requires-python = ">= 3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["academic", "paper", "downloader", "sci-hub", "crossref", "arxiv"]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "loguru>=0.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "bibtexparser>=1.4.0,<2",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]
socks = ["requests[socks]>=2.31"]

[project.urls]
Homepage = "https://github.com/fyangmie/paperman"
"Upstream" = "https://github.com/laq12345/paperman"

[project.scripts]
paperman = "paperman.cli:main"
paperman-bulk = "paperman.bulk:main"
paperman-doctor = "paperman.doctor:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
paperman = { path = ".", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pixi.tasks]
check = "ruff check src/"
fix = "ruff check --fix src/"
test = "pytest -v tests/"
all = "ruff check src/ && pytest -v tests/"
build-nuitka = "nuitka --standalone --onefile -o dist/paperman src/paperman/cli.py"

[tool.pixi.dependencies]
loguru = ">=0.7.3,<0.8"
typer = ">=0.27.0,<0.28"
rich = ">=15.0.0,<16"
requests = ">=2.34.2,<3"
beautifulsoup4 = ">=4.15.0,<5"
pydantic = ">=2.13.4,<3"
ruff = ">=0.15.22,<0.16"
pytest = ">=9.1.1,<10"
pyyaml = ">=6.0.2,<7"
bibtexparser = ">=1.4.0,<2"
nuitka = ">=4.1.3,<5"
setuptools = ">=83.0.0,<84"
libpython-static = ">=3.14.6,<4"
