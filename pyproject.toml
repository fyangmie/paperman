[project]
name = "paperman"
version = "0.1.0"
description = "Enhanced academic paper downloader with multi-source metadata and multi-channel PDF retrieval"
authors = [{name = "laq12345", email = "laq12345@stu.zzu.edu.cn"}]
requires-python = ">= 3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["academic", "paper", "downloader", "sci-hub", "crossref", "arxiv"]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "loguru>=0.7",
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5", "playwright>=1.61.0,<2", "undetected-chromedriver", "selenium", "setuptools>=83.0.0,<84",
]

[project.urls]
Homepage = "https://github.com/laq12345/paperman"

[project.scripts]
paperman = "paperman.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
paperman = { path = ".", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pixi.tasks]
check = "ruff check src/"
fix = "ruff check --fix src/"
test = "pytest -v tests/"
all = "ruff check src/ && pytest -v tests/"

[tool.pixi.dependencies]
loguru = ">=0.7.3,<0.8"
typer = ">=0.27.0,<0.28"
rich = ">=15.0.0,<16"
requests = ">=2.34.2,<3"
httpx = ">=0.28.1,<0.29"
beautifulsoup4 = ">=4.15.0,<5"
pydantic = ">=2.13.4,<3"
ruff = ">=0.15.22,<0.16"
pytest = ">=9.1.1,<10"
undetected-chromedriver = ">=3.5.5,<4"
selenium = ">=4.46.0,<5"
webdriver-manager = ">=4.1.2,<5"
playwright = ">=1.61.1,<2"
